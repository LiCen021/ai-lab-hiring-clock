name: Deploy site to GitHub Pages

on:
  push:
    branches: [master, main]
    paths: ["site/**", "data/processed/**", "tests/test_privacy.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install $(grep -E '^(pytest|pandas|pyarrow)==' requirements.txt)
      - name: Privacy guard (blocks the deploy on failure)
        run: python -m pytest -q tests/test_privacy.py

  deploy:
    needs: privacy-guard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site    # public, derived data only; never raw data (REQUIREMENTS §5)
      - id: deployment
        uses: actions/deploy-pages@v4
