name: Deploy site to GitHub Pages

# The site is built here from public data/processed/ only; site/*.html is not committed.
on:
  push:
    branches: [master, main]
    paths: ["data/processed/**", "src/sample_dashboard.py", "src/common.py", "src/templates/**",
            "config/**", "tests/test_privacy.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install $(grep -E '^(pytest|pandas|pyarrow|PyYAML)==' requirements.txt)
      - name: Build site from data/processed
        run: python -m src.sample_dashboard
      - name: Privacy guard on data/processed and the built site (blocks the deploy on failure)
        run: python -m pytest -q tests/test_privacy.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site    # public, derived data only; never raw data (REQUIREMENTS §5)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
